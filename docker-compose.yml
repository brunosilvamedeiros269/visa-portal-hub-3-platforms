version: '3.8'

services:
  # ==========================================
  # 1. BOOKSTACK (Wiki Corporativa e Estantes)
  # ==========================================
  bookstack_db:
    image: lscr.io/linuxserver/mariadb:latest
    container_name: visa_bookstack_db
    environment:
      - PUID=1000
      - PGID=1000
      - MYSQL_ROOT_PASSWORD=bookstack_root_pass
      - MYSQL_DATABASE=bookstack
      - MYSQL_USER=bookstack_user
      - MYSQL_PASSWORD=bookstack_pass
    volumes:
      - bookstack_db_data:/config
    restart: unless-stopped
    ports:
      - "3306:3306"

  bookstack:
    image: lscr.io/linuxserver/bookstack:latest
    container_name: visa_bookstack
    environment:
      - PUID=1000
      - PGID=1000
      - APP_URL=http://localhost:8080
      - DB_HOST=bookstack_db
      - DB_USER=bookstack_user
      - DB_PASS=bookstack_pass
      - DB_DATABASE=bookstack
    volumes:
      - bookstack_app_data:/config
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      - bookstack_db

  # ==========================================
  # 2. OPENPROJECT (Gestão Macro/Micro Projetos)
  # ==========================================
  openproject:
    image: openproject/openproject:latest
    container_name: visa_openproject
    environment:
      - OPENPROJECT_SECRET_KEY_BASE=visa_secret_key_super_secure_12345
      - OPENPROJECT_HOST__NAME=localhost:8082
      - OPENPROJECT_HTTPS=false
    ports:
      - "8082:80"
    volumes:
      - openproject_pgdata:/var/openproject/pgdata
      - openproject_assets:/var/openproject/assets
    restart: unless-stopped

volumes:
  bookstack_db_data:
  bookstack_app_data:
  openproject_pgdata:
  openproject_assets:
