services:
  # ==========================================
  # 1. BOOKSTACK WIKI (Free Web Service)
  # ==========================================
  - type: web
    name: visa-bookstack-wiki
    runtime: image
    image:
      url: docker.io/solidnerd/bookstack:latest
    plan: free
    envVars:
      - key: PUID
        value: "1000"
      - key: PGID
        value: "1000"

  # ==========================================
  # 2. OPENPROJECT (Free Web Service)
  # ==========================================
  - type: web
    name: visa-openproject
    runtime: image
    image:
      url: docker.io/openproject/openproject:14
    plan: free
    envVars:
      - key: OPENPROJECT_SECRET_KEY_BASE
        value: visa_secret_key_super_secure_12345
      - key: OPENPROJECT_HTTPS
        value: "true"
