<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>404 · Base de Conocimiento — Visa</title>
<style>
  :root{--navy:#0b1524;--card:#122131;--border:#243449;--gold:#FAA61A;--muted:#8A97A8;--text:#E7EEF6;--blue:#5b9bff;}
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{background:radial-gradient(1200px 600px at 50% -10%, #16273c 0%, var(--navy) 55%);
    color:var(--text);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
    display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;}
  .wrap{max-width:520px;}
  .art{width:150px;height:150px;margin:0 auto 6px;animation:float 4s ease-in-out infinite;}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .code{font-size:88px;font-weight:900;line-height:1;letter-spacing:2px;
    background:linear-gradient(180deg,#fff, #9fb4cc);-webkit-background-clip:text;background-clip:text;color:transparent;}
  h1{font-size:22px;margin:10px 0 6px;font-weight:800;}
  p{color:#c3cede;font-size:14.5px;line-height:1.6;margin:0 auto 22px;max-width:420px;}
  .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
  a.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:700;font-size:14px;
    padding:11px 18px;border-radius:11px;transition:transform .12s ease, background .12s ease;}
  a.gold{background:var(--gold);color:var(--navy);}
  a.gold:hover{transform:translateY(-2px);background:#ffb733;}
  a.ghost{border:1px solid var(--border);color:#cdd7e3;}
  a.ghost:hover{border-color:var(--gold);color:#fff;}
  .hint{margin-top:18px;font-size:12px;color:var(--muted);}
  kbd{background:#1b2942;border:1px solid var(--border);border-radius:4px;padding:1px 6px;font-size:11px;color:#cbd5e1;}
  .mark{position:fixed;top:18px;left:22px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;color:#cbd5e1;}
  .mark b{background:var(--gold);color:var(--navy);font-weight:800;padding:2px 7px;border-radius:5px;font-size:11px;letter-spacing:1px;}
</style>
</head>
<body>
  <div class="mark"><b>VISA</b> Base de Conocimiento</div>
  <div class="wrap">
    <svg class="art" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect x="14" y="34" width="78" height="50" rx="8" fill="#16273c" stroke="#33496a" stroke-width="2"/>
      <rect x="14" y="44" width="78" height="9" fill="#0e1b2c"/>
      <rect x="22" y="64" width="26" height="6" rx="3" fill="#33496a"/>
      <circle cx="24" cy="26" r="4" fill="#FAA61A" opacity=".7"/>
      <circle cx="100" cy="30" r="3" fill="#5b9bff" opacity=".6"/>
      <circle cx="98" cy="92" r="4" fill="#FAA61A" opacity=".5"/>
      <circle cx="86" cy="78" r="20" fill="none" stroke="#FAA61A" stroke-width="4"/>
      <line x1="100" y1="92" x2="112" y2="104" stroke="#FAA61A" stroke-width="5" stroke-linecap="round"/>
      <path d="M80 74 l12 0 M86 68 l0 12" stroke="#FAA61A" stroke-width="3" stroke-linecap="round" opacity=".5"/>
    </svg>
    <div class="code">404</div>
    <h1>Esta página se fue a tokenizar 🔐</h1>
    <p>El enlace no existe o cambió de lugar (a veces pasa cuando renombramos una nota). Probá la búsqueda o volvé al inicio.</p>
    <div class="btns">
      <a class="btn gold" href="/">← Volver al inicio</a>
      <a class="btn ghost" href="/">🔎 Buscar en la base</a>
    </div>
    <div class="hint">Tip: dentro del wiki, abrí la búsqueda con <kbd>Ctrl</kbd> + <kbd>K</kbd>.</div>
  </div>
</body>
</html>
